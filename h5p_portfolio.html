<header>
  <h1 class="title">H5P Examples</h1>
</header>
<main>
  <section>
    <h2 class="subtitle">Welcome</h2>
    <p>This is a modern HTML5 boilerplate for your portfolio project.</p>
  </section>

  <div class="buttons" id="activity-buttons"></div>
  <div id="activity-panels"></div>
  <script id="h5p-activity-data" type="application/json">{{ h5pActivities | json }}</script>
  <script src="https://cdn.jsdelivr.net/npm/h5p-standalone@latest/dist/main.bundle.js"></script>
</main>
<footer>
  <p>&copy; 2026 Paul Sijpkes</p>
</footer>
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    const activityData = JSON.parse(document.getElementById('h5p-activity-data').textContent || '[]');
    const activities = activityData.map((activity) => ({
      name: activity.name,
      label: activity.label,
      path: activity.path
    }));

    const buttonContainer = document.getElementById('activity-buttons');
    const panelContainer = document.getElementById('activity-panels');

    if (!activities.length) {
      panelContainer.innerHTML = '<p>No H5P activities found.</p>';
      return;
    }

    activities.forEach((activity, index) => {
      const button = document.createElement('button');
      button.className = 'button is-link';
      button.textContent = activity.label;
      button.addEventListener('click', () => showActivity(activity.name));
      buttonContainer.appendChild(button);

      const panel = document.createElement('div');
      panel.id = `h5p-${activity.name}`;
      panel.style.display = index === 0 ? 'block' : 'none';
      panel.className = 'mt-4';
      panelContainer.appendChild(panel);

      const options = {
        h5pJsonPath: activity.path,
        frameJs: 'https://cdn.jsdelivr.net/npm/h5p-standalone@latest/dist/frame.bundle.js',
        frameCss: 'https://cdn.jsdelivr.net/npm/h5p-standalone@latest/dist/styles/h5p.css',
      };

      new H5PStandalone.H5P(panel, options);
    });

    function showActivity(name) {
      Array.from(panelContainer.children).forEach((panel) => {
        panel.style.display = panel.id === `h5p-${name}` ? 'block' : 'none';
      });
    }
  });
</script>
