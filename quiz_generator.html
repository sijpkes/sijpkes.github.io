<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            resize: vertical;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #download-link {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Quiz Generator</h1>

            <div class="field">
                <label class="label" for="quiz-name">Quiz Name</label>
                <div class="control">
                    <input class="input" type="text" id="quiz-name" placeholder="Enter quiz name">
                </div>
            </div>

            <div class="field">
                <label class="label" for="quiz-data">Quiz Questions Prompt</label>
                <div class="content">
                    <p>
                        Generate the quiz questions using this prompt in your GenAI tool:
                        <br><br>
                        <textarea readonly=1 class="has-background-light p-3 is-block" id="prompt">
                            Generate a list of 20 multiple choice questions with 3 options per question including feedback.<br>
                            Draw on the knowledge provided in this document (attach document with the content students need to know).<br>
                            Format the questions in this JSON format: 
                            [{"question": "...", "options": { "A": "...", "B": "..." }, "correctAnswer": "..."}, feedback: { "A": "...", "B": "..."}]
                        </textarea>
                        <br>
                        <button class="button is-link" id="copy-btn">Copy prompt</button>
                        <br><br>
                        Paste the generated JSON below.
                    </p>
                </div>
            </div>

            <div class="field">
                <label class="label" for="quiz-data">Generated JSON</label>
                <div class="control">
                    <textarea class="textarea" id="quiz-data" placeholder="Paste the generated JSON here"></textarea>
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button class="button is-primary" id="generate-quiz">Generate Quiz</button>
                </div>
                <div class="control">
                    <a class="button is-success is-hidden" id="download-link" download="quiz.html" href="#">Download Quiz</a>
                </div>
            </div>

            <div class="field">
                <label class="label" for="quiz_html">Preview</label>
                <div class="box" id="quiz_html"></div>
            </div>
        </div>
    </section>
    <script>
        function clipboard_copy(copyText) {
            // Get the text field


            // Select the text field
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices

            // Copy the text inside the text field
            navigator.clipboard.writeText(copyText.value);

            // Alert the copied text
            alert("Copied the text: " + copyText.value);
        }

        const btn = document.getElementById("copy-btn")

        btn.addEventListener("click", (e) => {
            e.preventDefault()
            var element = document.getElementById("prompt");
            clipboard_copy(element)
        })

        const generateQuizBtn = document.getElementById('generate-quiz');
        const quizDataInput = document.getElementById('quiz-data');
        const quizNameInput = document.getElementById('quiz-name');
        const downloadLink = document.getElementById('download-link');


        const styles = `body {
                font-family: Arial, sans-serif;
                padding: 20px;
                background-color: #f9f9f9;
            }
            .quiz-container {
                max-width: 600px;
                margin: auto;
                background-color: #fff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .question {
                font-size: 18px;
                font-weight: bold;
            }
            .options label {
                display: block;
                margin-bottom: 10px;
                cursor: pointer;
            }
            .btn {
                padding: 10px 20px;
                background-color: #007bff;
                color: white;
                cursor: pointer;
                border: none;
                border-radius: 5px;
                margin-top: 15px;
            }
            .hidden {
                display: none;
            }`;

        generateQuizBtn.addEventListener('click', () => {
            const quizData = JSON.parse(quizDataInput.value); // Parsing the quiz data from JSON
            const quizName = quizNameInput.value || "Quiz"; // Fetching the quiz name or using a default

            const quizBody = `<body><div class="quiz-container" id="quiz-container"></div></body>`;
            const quizHTML = `<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${quizName}</title><style>${styles}</style></head>${quizBody}</html>`;

            const store_html = document.getElementById("quiz_html");
            store_html.innerHTML = quizHTML;

            // Create the script content as a string
            const scriptContent = `
        const quizData = ${JSON.stringify(quizData)};
        let currentQuestionIndex = 0;
        function loadQuestion() {
            const questionData = quizData[currentQuestionIndex];
            const quizContainer = document.getElementById('quiz-container');
            let questionHTML = '<p class="question">' + questionData.question + '</p>';
            questionHTML += '<div class="options">';
            for (const option in questionData.options) {
                questionHTML += \`<label><input type="radio" name="option" value="\${option}"> \${option}: \${questionData.options[option]}</label>\`;
            }
            questionHTML += '</div>';
            questionHTML += '<div class="btn" id="check-btn">Check</div>';
            quizContainer.innerHTML = questionHTML;
            document.getElementById('check-btn').addEventListener('click', checkAnswer);
        }
        function checkAnswer() {
            const selectedOption = document.querySelector('input[name="option"]:checked')?.value;
            const questionData = quizData[currentQuestionIndex];
            if (selectedOption) {
                if (selectedOption === questionData.correctAnswer) {
                    alert("Correct!");
                } else {
                    alert("Incorrect! The correct answer is " + questionData.correctAnswer);
                }
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    document.getElementById('quiz-container').innerHTML = '<p>Quiz complete!</p>';
                }
            } else {
                alert('Please select an option.');
            }
        }
        loadQuestion();
    `;

            // Create a new script element and append it to the page
            const scriptElement = document.createElement('script');
            scriptElement.textContent = scriptContent;
            document.body.appendChild(scriptElement);

            // Create a Blob object from the HTML string
            const blob = new Blob([quizHTML], { type: 'text/html' });

            // Create a temporary URL for the Blob
            const url = URL.createObjectURL(blob);

            // Set the download link's href to the temporary URL
            downloadLink.href = url;

            // Display the download link
            downloadLink.style.display = 'block';
        });

    </script>
</body>

</html>
